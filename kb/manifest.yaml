    summary: >-
      A 2023 WWF-Australia article on nine groups of native plants that feed
      wildlife in gardens and on apartment balconies. Gum trees (Eucalyptus)
      support koalas, native bees and large birds. Banksias give nectar to
      bees, birds and small mammals. Bottlebrushes (Callistemon) feed and
      shelter possums, flying-foxes, lizards, insects and nectar-eating birds,
      with little care. Wattles (Acacia) give birds food and shelter and bees
