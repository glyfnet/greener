      vital food source for butterflies, moths and native bees), Bakers Creek,
      Lana, lemon, alpine and river bottlebrushes, small-fruit hakea, and the
      tea-trees Leptospermum arachnoides, L. brevipes, L. gregarium,
      L. minutifolium, L. novae-angliae and jellybush (L. polygalifolium).
      Most are shrubs of 1.5–4 m. Together they flower across winter, spring
      and summer, which keeps food available for pollinators through the
      year. None of these species is marked as non-local on the group's
      general list.

