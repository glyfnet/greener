    summary: >-
      A tray of forty hiko seedlings from the Armidale Tree Group for privacy
      screening: dense shrubs, mostly 3–5 m tall, that also give nectar to
      birds. The selection draws on: knife-leaf wattle (Acacia cultriformis),
      white sally wattle (A. floribunda), Ovens wattle (A. pravissima),
      jellybush (Leptospermum polygalifolium), Bakers Creek and Lana
      bottlebrushes (Callistemon pungens), lemon bottlebrush (C. pallidus),
      river bottlebrush (C. sieberi), weeping bottlebrush (C. viminalis), tree
      hakea (Hakea eriantha, a food source for yellow-tailed black cockatoos)
      and willow-leaved hakea (H. salicifolia). Caution for rewilding: the
      group's own 2026 general list marks Ovens wattle, tree hakea and
      willow-leaved hakea as not local to the New England Tablelands. For a
      local-natives planting, ask the nursery for a mix without them, or
      choose the Saumarez or Bee pack instead (D-17).

