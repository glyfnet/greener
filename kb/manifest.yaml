    summary: >-
      A 2024 guide from a commercial breeder of native plant cultivars. Its
      main point is that native gardens are not maintenance-free: like any
      garden they need regular care, and some natives need more than some
      exotics. Plant in the cooler months, from autumn to early spring, but
      avoid planting young banksias in winter in cold areas because frost can
      damage them. Clear weeds and grass, dig a hole as deep as the root ball
      and at least twice as wide, plant at the same depth as in the pot, add
      compost, backfill, firm gently and water well. Mulch 5–10 cm deep and
      keep it away from stems. Lilly pillies and bottlebrushes may need
      regular pruning; native grasses such as Poa can be cut back to the base
      after flowering or every few years. Melaleucas suit soil that stays
      wet. Most plants it recommends are the company's own trademarked or
      PBR cultivars, so prefer local, wild-type species where they will do
      (D-17). Greener does not use its fertiliser or spray advice.

