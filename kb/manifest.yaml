      Native bluebell (Wahlenbergia stricta) suits pots and hanging baskets in
      light shade and attracts bees and butterflies. Everlasting daisies
      (Xerochrysum) like full sun and heat. It warns that some natives are
      weeds outside their home range, so check council or nursery lists for
      local species. Useful for the apartment strategy.

