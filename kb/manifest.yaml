      A garden-product brand's guide to growing natives. Greener uses only
      its general advice, not its product, fertiliser or insect-spray
      recommendations (D-17), and not its suggestion to mix natives with
      exotic plants. Most natives want full sun, so plant them facing north,
      north-east or west, and ask a local nursery about each plant's needs.
      Dianella longifolia, Lomandra longifolia and Acacia cognata are named
      for dry shade. Only established natives are drought tolerant: water new
      plants often in the first month, then cut back over about three months,
      and soak deeply in long hot spells. Use coarse mulch such as wood chip
      or bark. Trim up to a third after flowering and remove dead branches.
      It describes pests to watch for: callistemon tip borer (stuck-together
      new leaves; prune them off), sawfly larvae, scale with sooty mould,
      myrtle rust on eucalypts, bottlebrushes and melaleucas, psyllid galls
      on lilly pillies, and root rot in waterlogged clay.

