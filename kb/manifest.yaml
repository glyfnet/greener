# Global knowledge base manifest (FR-41, FR-42, D-15).
#
# Two tiers:
#   open_content    full text in kb/sources/<file>. Only with a licence that
#                   permits redistribution, or text the maintainer wrote
#                   (licence: maintainer → CC BY 4.0, kb/LICENSE).
#   link_catalogue  URL, metadata and a thorough summary in our own words
#                   (at least 80 words, no copied passages). Claude reads
#                   the live page for detail (FR-46).
#
# Every item needs: id, title, sourceUrl, publisher, licence, tier, region,
# dateChecked (YYYY-MM-DD) and tags. A source used with permission records
# it under `permission` (Q-20). See docs/kb-guide.md.
#
