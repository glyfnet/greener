    title: Armidale Tree Group — Every Tree Counts brochure
    tier: link_catalogue
    sourceUrl: https://armidaletreegroup.org.au/wp-content/uploads/ETC_Brochure.pdf
    publisher: Armidale Tree Group
    licence: "Link and summary only. No licence stated (site footer: © Armidale Tree Group)."
    region: NSW Northern Tablelands
    dateChecked: "2026-11-25"
    tags: [Every Tree Counts, landscape repair, wildlife corridors, Saumarez Creek, dieback, connectivity, koalas, carbon, landholders, donations, maintenance]
    summary: >-
      A brochure (2017) for Every Tree Counts, the Armidale Tree Group's
      30-year revegetation program for the New England region. It works
      through landholder partnerships and donations, and puts quality ahead
      of numbers: every planting gets ground preparation and two years of
      maintenance, because weeds and lack of water stunt young trees. A $10
      donation pays for one tree with materials, planting and up to two years
      of care. The first projects were a Saumarez Creek wildlife corridor
      linking the eastern and western sides of the Northern Tablelands, work
      against dieback and for connectivity around the Gara River and Imbota
      area, and a 3 ha urban forest on the Dumaresq Creek floodplain in
      Armidale. The program's web page names four themes: connectivity,
      koalas, dieback (which killed millions of New England trees in the
      1970s and 1980s) and carbon. Landholders near these areas can ask the
      group about joining a corridor planting. The group has grown and
      planted more than 1.5 million trees and shrubs since 1983.
