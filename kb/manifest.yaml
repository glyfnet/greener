  - id: phillip-island-bushbank-planting-guide
    title: Phillip Island Nature Parks — Barb Martin Bushbank planting guide
    tier: link_catalogue
    sourceUrl: https://www.penguins.org.au/assets/About/Barb-Martin-Bushbank/Bushbank-Planting-Guide-A4.pdf
    publisher: Phillip Island Nature Parks (Barb Martin Bushbank nursery)
    licence: "Link and summary only. No licence stated in the PDF."
    region: VIC (Phillip Island)
    dateChecked: "2026-11-25"
    tags: [planting tubestock, planting hole, roots, mulch, watering, tree guards, staking, pruning, planting time, indigenous nursery, Phillip Island, pot reuse]
    summary: >-
      A one-page planting guide from the indigenous plant nursery run by
      Phillip Island Nature Parks, which grows its stock from cuttings made
      by volunteers. Best planting time is autumn to winter, so plants
      establish before the heat; spring works with extra summer watering.
      Soak tubes when you get them home and plant soon. Tap plants out of the
      pot, never pull them. Dig about 100 mm deeper and wider than the pot,
      fill a dry hole with water first, set the top of the roots just below
      the soil, and mound leftover soil into a watering basin. Do not tease
      the roots. Mulch 50–100 mm deep, but keep it off the stem to avoid
      collar rot. Water deeply rather than little and often, and water before
      a heatwave. Tree guards help against frost, wind and grazing; if
      staking is needed, use three stakes and remove them early. Tip prune
      shrubs in mild weather. The nursery, at 1810 Phillip Island Road, takes
      back empty pots for reuse.

