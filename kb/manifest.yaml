    summary: >-
      A National Science Week article from August 2026, built on advice from
      a plant breeder at Kings Park and Botanic Garden in Perth. Whether a
      native will grow for you depends on the species: choose plants from a
      rainfall and climate like your own, and match the soil to where the
      plant comes from (Western Australian plants generally need very
      free-draining, sandy soil). Natives still need water: water often until
      they are established, then taper off, and use deep soaks two or three
      times a week in hot weather. Plant in mild weather. Prune straight
      after flowering, taking up to a third, but never cut back to bare wood
      with no leaves. Banksias, grevilleas and hakeas are sensitive to
      phosphorus. Flannel flowers and kangaroo paws need smoke treatment to
      germinate from seed; some plants, such as melaleucas, grow from
      cuttings. Lomandra and bottlebrushes need little care. Buy from
      specialist native nurseries. Greener does not use the article's
      fertiliser advice (D-17).

