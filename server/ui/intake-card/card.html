<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Greener question</title>
<style>
  :root { color-scheme: light dark; --fg: #1d2a1f; --bg: #ffffff; --muted: #5b6b5e; --line: #c9d6cb; --accent: #2f6b3a; --accent-bg: #e3f0e5; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6efe7; --bg: #151a16; --muted: #a3b3a6; --line: #3a4a3d; --accent: #8fd19b; --accent-bg: #24372a; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; max-width: 240px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  h1 { font-size: 20px; margin: 16px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  button { font: inherit; color: inherit; min-height: 44px; min-width: 44px; cursor: pointer; }
  .opt { padding: 14px 10px; border: 2px solid var(--line); border-radius: 10px; background: transparent; text-align: center; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  .opt .icon { display: block; font-size: 12px; color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0 8px; }
  .primary { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; }
  .secondary { padding: 10px 14px; border: 2px solid var(--line); border-radius: 8px; background: transparent; }
  .spacer { flex: 1; }
  input[type=text] { font: inherit; flex: 1; min-width: 180px; min-height: 44px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; color: inherit; background: transparent; }
  .msg { margin-top: 12px; color: var(--muted); }
  .err { color: #b3261e; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p>Loading the question…</p></main>
<script>/*CARD_SCRIPT*/</script>
</body>
</html>
